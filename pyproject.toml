[project]
name = "vn-commune-distance-pipeline"
version = "0.1.0"
description = "Reproducible open-data pipeline for Vietnam commune centroids"
requires-python = ">=3.13"
dependencies = [
  "osmium==4.3.1",
  "pypdf==6.1.1",
  "pyproj==3.7.2",
  "pyyaml==6.0.3",
  "shapely==2.1.2",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests/python"]
